name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Clippy (test-support)
        run: cargo clippy --all-targets --locked --features test-support -- -D warnings

      - name: Test (default features)
        run: cargo test --all-targets --locked

      - name: Test (test-support)
        run: cargo test --all-targets --locked --features test-support

      - name: Test documentation
        run: cargo test --doc --locked --features test-support

  msrv:
    name: minimum Rust 1.80
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install minimum Rust
        run: rustup toolchain install 1.80.0 --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: msrv

      - name: Test minimum Rust (default features)
        run: cargo +1.80.0 test --all-targets --locked

      - name: Test minimum Rust (test-support)
        run: cargo +1.80.0 test --all-targets --locked --features test-support
